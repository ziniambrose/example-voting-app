
name: Voting App CI

on:
  push:
    branches:
      - main
      - feature/github-actions-ci
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            context: vote
            dockerfile: vote/Dockerfile
          - service: result
            context: result
            dockerfile: result/Dockerfile
          - service: worker
            context: worker
            dockerfile: worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker image
        run: |
          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "local/${{ matrix.service }}:${GITHUB_SHA}" \
            "${{ matrix.context }}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Prepare GHCR image name
        id: image
        run: |
          REPOSITORY=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${REPOSITORY}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          docker tag \
            "local/${{ matrix.service }}:${GITHUB_SHA}" \
            "${{ steps.image.outputs.name }}:${GITHUB_SHA}"

          docker push "${{ steps.image.outputs.name }}:${GITHUB_SHA}"
